name: Test QSM
on: [push, pull_request]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
            dependencies: qiskit==1.2.4 qiskit-aer==0.15.1
          - os: windows-latest
            python: '3.11'
            dependencies: qiskit==1.2.4 qiskit-aer==0.15.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ${{ matrix.dependencies }}
      - run: python -m unittest discover -s tests -v
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
